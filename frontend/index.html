<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makan+</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
  </head>
  <body>
    <div class="login-screen">

      <div class="login-logo">
        <div class="logo-mark">
          <img src="assets/logo.png" alt="ماکان پلاس">
        </div>
        <h1 class="login-brand">ماکان<span>+</span></h1>
        <p class="login-subtitle">سامانه منابع انسانی · گروه صنعتی طبیعت ماکان</p>
      </div>

      <div class="login-form">

        <div class="field-group">
          <label for="employee-id" class="field-label">کد پرسنلی</label>
          <div class="field-wrapper">
            <input
              class="field-input"
              type="text"
              id="employee-id"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            >
          </div>
        </div>

        <div class="field-group">
          <label for="password" class="field-label">رمز عبور</label>
          <div class="field-wrapper">
            <input
              class="field-input"
              type="password"
              id="password"
              placeholder="رمز عبور خود را وارد کنید"
              autocomplete="current-password"
            >
            <button class="field-toggle" id="toggle-password" type="button">
              <span id="toggle-icon">👁</span>
            </button>
          </div>
        </div>

        <div class="error-message" id="error-message"></div>

        <button class="btn-primary" id="login-btn" type="button">
          ورود به سامانه
        </button>

        <button class="btn-ghost" type="button">
          فراموشی رمز عبور؟
        </button>

      </div>

      <p class="login-footer">اتصال امن · معاونت برنامه‌ریزی و توسعه سیستم‌ها طبیعت ماکان</p>

    </div>

    <script src="js/login.js"></script>
  </body>
</html>
