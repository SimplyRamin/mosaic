<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mosaic  · خانه</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/home.css">
  <script src="../js/app.js" defer></script>
  <script src="../js/home.js" defer></script>
  <link rel="icon" type="image/png" href="../assets/icons/icon-pwa.png">
  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mosaic">
  <link rel="apple-touch-icon" href="../assets/icons/icon-pwa.png">
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
      </symbol>

      <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/>
          <circle cx="12" cy="13" r="3"/>
      </symbol>

      <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </symbol>

      <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
      </symbol>

      <symbol id="icon-sitemap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="15" width="6" height="4" rx="1"/>
          <rect x="15" y="15" width="6" height="4" rx="1"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M6 19v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <path d="M12 7v6"/>
      </symbol>

      <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4"/>
          <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
      </symbol>

      <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
      </symbol>

      <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
      </symbol>

      <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </symbol>

      <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
      </symbol>

      <symbol id="icon-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
      </symbol>

      <symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
      </symbol>

      <symbol id="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </symbol>

      <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
          <path d="M9 22V12h6v10"/>
          <path d="M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01"/>
      </symbol>

      <symbol id="icon-user-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <polyline points="16 11 18 13 22 9"/>
      </symbol>

      <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
      </symbol>

      <symbol id="icon-user-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="10" r="3"/>
          <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/>
      </symbol>

      <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
      </symbol>

      <symbol id="icon-microphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <path d="M12 19v4"/>
          <path d="M8 23h8"/>
      </symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
      </symbol>
    </svg>

  <div class="screen">

    <!-- Header -->
    <header class="top-bar">
      <div class="greeting">
        <span class="greeting-text">سلام،</span>
        <span class="greeting-name" id="user-name">رامین فردوس</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="notification-btn">
          <svg class="icon notif-icon"><use href="#icon-bell"></use></svg>
          <span class="notif-badge" id="notif-badge"></span>
        </button>
        <div class="avatar" id="user-avatar">رف</div>
        <button class="logout-btn" id="logout-btn">
          <svg class="icon"><use href="#icon-logout"></use></svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-section">
      <div class="search-bar" id="search-bar">
        <svg class="icon search-icon"><use href="#icon-search"></use></svg>
        <input
          type="text"
          class="search-input"
          id="search-input"
          placeholder="جستجوی افراد و واحدها"
          autocomplete="off"
        >
        <button class="mic-btn" id="mic-btn">
          <svg class="icon"><use href="#icon-microphone"></use></svg>
        </button>
        <button class="camera-btn" id="camera-btn">
          <svg class="icon"><use href="#icon-camera"></use></svg>
        </button>
      </div>
    </div>

    <!-- Filter chips -->
    <div class="chips-section">
      <div class="chips-scroll">
        <button class="chip active" data-filter="all">همه</button>
      </div>
    </div>

    <!-- Scrollable content -->
    <main class="main-content">
      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-number" id="active-count">۳،۸۴۷</span>
          <span class="stat-label">کارمند فعال</span>
        </div>
        <div class="stat-card">
          <div class="gender-stat">
            <div class="gender-row">
              <span class="gender-label">مرد</span>
              <span class="gender-percent" id="male-percent">۷۲٪</span>
            </div>
            <div class="gender-bar">
              <div class="gender-fill gender-fill--male" id="male-fill"></div>
            </div>
            <div class="gender-row" style="margin-top:4px">
              <span class="gender-label">زن</span>
              <span class="gender-percent" id="female-percent">۲۸٪</span>
            </div>
            <div class="gender-bar">
              <div class="gender-fill gender-fill--female" id="female-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Metrics section -->
       <section class="metrics-section" id="metrics-section">
        <h2 class="section-title">آمار سازمانی</h2>

        <!-- Second stats row -->
         <div class="stats-row">
          <div class="stat-card">
            <span class="stat-number" id="avg-age">-</span>
            <span class="stat-label">میانگین سنی</span>
          </div>
          <div class="stat-card">
            <span class="stat-number stat-number--total" id="avg-tenure">-</span>
            <span class="stat-label">میانگین سابقه (سال)</span>
          </div>
         </div>

         <!-- Top departments -->
          <h2 class="section-title" style="margin-top: var(--space-md)">۵ واحد بزرگ سازمانی</h2>
          <div class="dept-list" id="dept-list"></div>
       </section>

      <!-- Recently viewed section -->
      <section class="people-section" id="recent-section">
        <h2 class="section-title">اخیراً مشاهده شده</h2>
        <div class="people-list" id="recent-list">
          <!-- Cards injected by JS -->
        </div>
      </section>
    </main>
  </div>
  
</body>
</html>
